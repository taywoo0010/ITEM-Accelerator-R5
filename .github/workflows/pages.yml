name: Deploy ITEM General Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare only the public static files
        run: |
          mkdir -p _pages
          cp Item_General_Demo.html .nojekyll _pages/
          cp Item_General_Demo.html _pages/index.html
          cp Item_General_Demo.html _pages/Item_ISS_Meeting_R5.html
          cp -R assets media _pages/
          mkdir -p _pages/docs
          cp docs/Item_General_Demo.md _pages/docs/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
